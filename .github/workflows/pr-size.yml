name: PR size

# GitHub blocks pull_request_target by default in public repositories from 2026-12-02.
# This workflow runs only while an Actions policy allows pull_request_target for this file;
# see GitHub's pull_request_target policy. It reads PR metadata through the API and runs
# default-branch scripts only.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  # Needed only for trusted default-branch scripts, not PR contents.
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Do not install dependencies or check out/run PR code with this token.
      - run: node scripts/pr-size.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
