<main class="page">
  <div class="sheet">
    <label class="sr" for="title">Title</label>
    <input id="title" placeholder="What are you reading?" autocomplete="off" disabled />
    <label class="sr" for="notes">Notes</label>
    <textarea id="notes" placeholder="Passages, thoughts and questions. Notes stay with this chat." disabled></textarea>
  </div>
</main>
<footer class="bar">
  <div class="sheet row">
    <p id="status" role="status">Loading notes…</p>
    <button id="retry" type="button" hidden></button>
    <button id="quote" type="button" disabled>Add latest reply</button>
    <button id="discuss" class="primary" type="button" disabled>Discuss in chat</button>
  </div>
</footer>
